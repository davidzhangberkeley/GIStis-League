<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Grocery Accessibility — Bay Area</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1>Accessibility Indices of the Bay</h1>

    <div id="controls">
      <button id="tractToggle">Tracts Data Layer On</button>
      <button id="resetView">Back To Bay</button>
      <button id="underservedToggle">Show Underserved Areas</button>

      <div class="control-label">Color tracts by:</div>
      <select id="layerSelect">
        <optgroup label="Accessibility">
          <option value="accessibility">Accessibility Index</option>
          <option value="underserved">Underserved Classification</option>
        </optgroup>
        <optgroup label="Race &amp; Ethnicity">
          <option value="pct_poc">% People of Color</option>
          <option value="pct_white_nh">% White (Non-Hispanic)</option>
          <option value="pct_black_nh">% Black (Non-Hispanic)</option>
          <option value="pct_asian_nh">% Asian (Non-Hispanic)</option>
          <option value="pct_hispanic">% Hispanic</option>
        </optgroup>
        <optgroup label="Socioeconomic">
          <option value="median_income">Median Income</option>
          <option value="homeownership">Homeownership Rate</option>
          <option value="median_home_value">Median Home Value</option>
          <option value="pop_density">Population Density</option>
        </optgroup>
      </select>

      <div class="control-label">Machine Learning Model</div>
      <div id="ml-container" style="background: rgba(255,255,255,0.8); padding: 8px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd;">
        <div style="font-size: 11px; margin-bottom: 5px; color: #666;">Select Training Features:</div>
        
        <label class="feature-checkbox" style="display: flex; align-items: center; font-size: 12px; gap: 5px; margin-bottom: 3px;">
          <input type="checkbox" class="ml-feature" value="pop_density" checked> Pop. Density
        </label>
        <label class="feature-checkbox" style="display: flex; align-items: center; font-size: 12px; gap: 5px; margin-bottom: 3px;">
          <input type="checkbox" class="ml-feature" value="median_income" checked> Median Income
        </label>
        <label class="feature-checkbox" style="display: flex; align-items: center; font-size: 12px; gap: 5px; margin-bottom: 3px;">
          <input type="checkbox" class="ml-feature" value="pct_poc"> % POC
        </label>

        <button id="run-ml-btn" style="background: #3498db; color: white; width: 100%; border: none; margin-top: 5px; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold;">
          Run Regression
        </button>
        
        <div id="ml-results" style="font-size: 11px; margin-top: 8px; color: #333; display: none;">
          <strong>Results:</strong>
          <div id="r2-display">R²: --</div>
          <div id="rmse-display">RMSE: --</div>
        </div>
      </div>
      
      <div class="control-label">Jump to city:</div>
      <div id="cityButtons">
        <button class="city-btn" data-city="sf">SF</button>
        <button class="city-btn" data-city="oakland">Oakland</button>
        <button class="city-btn" data-city="berkeley">Berkeley</button>
      </div>
    </div>

    <div id="legend">
      <div class="legend-title" id="legend-title">Accessibility Index</div>
      <div id="legend-items"></div>
      <div class="legend-divider"></div>
      <div class="legend-title">Grocery Stores</div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#3b82f6"></div>
        <span class="legend-label">Berkeley</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#33a02c"></div>
        <span class="legend-label">Oakland</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#e31a1c"></div>
        <span class="legend-label">San Francisco</span>
      </div>
    </div>

    <div id="info-panel" class="hidden">
      <button id="panel-close">✕</button>
      <div id="panel-content"></div>
    </div>

    <div id="map"></div>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
